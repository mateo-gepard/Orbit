name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: App checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      THREADMAP_BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: License policy
        run: npm run audit:licenses

      - name: Deployment region policy
        run: npm run audit:regions

      - name: Release contract
        run: npm run release:contract

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  rules:
    name: Firebase rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.5.1

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Test security rules
        run: npm run test:rules

  functions:
    name: Functions build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Pin npm
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        working-directory: functions
        run: npm ci

      - name: Dependency audit
        working-directory: functions
        run: npm audit --audit-level=high

      - name: License policy
        working-directory: functions
        run: node ../scripts/check-licenses.mjs .

      - name: Build functions
        working-directory: functions
        run: npm run build

      # Covers the MCP OAuth authorization-server suite and the DAL content
      # projection, neither of which the root vitest run can reach.
      - name: Test functions
        working-directory: functions
        run: node --test 'lib/**/*.test.js'

  browser:
    name: Browser release smoke
    needs: app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      THREADMAP_BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit

      - name: Cold-load desktop, Android, and iOS routes
        run: npm run test:e2e

      - name: Preserve browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: browser-smoke-${{ github.sha }}
          path: |
            .vercel/playwright-report
            .vercel/playwright-results
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
